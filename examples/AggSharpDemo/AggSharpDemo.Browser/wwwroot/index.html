<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>agg-sharp demo</title>
	<!-- Relative, not "/": the site is served from a GitHub Pages project path, not a domain root. -->
	<base href="./" />
	<style>
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e1e1e; color: #ddd; font-family: sans-serif; }
		/* Sized in CSS only: input.js sets the backing store from the client size and devicePixelRatio. */
		#agg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
		#status { position: absolute; left: 12px; bottom: 12px; margin: 0; font-size: 13px; text-shadow: 0 0 4px #000; pointer-events: none; }
		#blazor-error-ui { display: none; position: fixed; bottom: 0; width: 100%; padding: 8px; background: #ffe0b2; color: #000; }
	</style>
</head>

<body>
	<!-- The canvas agg binds (BrowserSystemWindow.CanvasSelector's default). tabindex lets it take focus,
	     which is what lets keyboard events reach it. -->
	<canvas id="agg-canvas" tabindex="0"></canvas>

	<pre id="status">loading...</pre>

	<div id="blazor-error-ui">
		An unhandled error has occurred.
		<a href="" class="reload">Reload</a>
	</div>

	<script>
		window.aggHostStatus = message => {
			document.getElementById('status').textContent = message;
		};
	</script>

	<!-- No Blazor components: Blazor only boots the runtime; Program.cs does the rest. PlatformBrowser's JS
	     modules are imported by BrowserHostBootstrap, not listed here. -->
	<script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
