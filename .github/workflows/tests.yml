name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build tests
        run: dotnet build Tests/Agg.Tests/Agg.Tests.csproj --configuration Release

      # global.json at the repo root opts in to the Microsoft.Testing.Platform-native
      # `dotnet test` (VSTest is unsupported on the .NET 10 SDK; the dotnet.config opt-in
      # is not honored). Test options therefore use MTP syntax (--report-trx), not VSTest
      # (--logger). Note MTP's --timeout is a whole-session cap, not per-test.
      # --maximum-parallel-tests 1: the UI automation tests share window/input state and
      # fail intermittently when run in parallel; serializing costs no wall-clock time.
      - name: Run tests
        run: dotnet test Tests/Agg.Tests/Agg.Tests.csproj --configuration Release --no-build --report-trx --report-trx-filename results.trx --results-directory TestResults --maximum-parallel-tests 1

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 30
