name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build tests
        run: dotnet build Tests/Agg.Tests/Agg.Tests.csproj --configuration Release

      # global.json at the repo root opts in to the Microsoft.Testing.Platform-native
      # `dotnet test` (VSTest is unsupported on the .NET 10 SDK; the dotnet.config opt-in
      # is not honored). Test options therefore use MTP syntax (--report-trx), not VSTest
      # (--logger). Note MTP's --timeout is a whole-session cap, not per-test.
      # --maximum-parallel-tests 1: the UI automation tests share window/input state and
      # fail intermittently when run in parallel; serializing costs no wall-clock time.
      - name: Run tests
        run: dotnet test Tests/Agg.Tests/Agg.Tests.csproj --configuration Release --no-build --report-trx --report-trx-filename results.trx --results-directory TestResults --maximum-parallel-tests 1

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 30

      # The runners have no GPU, so the golden suites render on D3D12's software rasterizer
      # (WARP) and look for the d3d12-warp golden set. This artifact is where that set comes
      # from: a missing or mismatched golden writes the render it actually produced into
      # GoldenImageFailures, so the warp set is baselined - and later re-baselined - by
      # downloading these PNGs. It has to be CI's own renders, because WARP ships with Windows
      # and a local AGG_FORCE_WARP=1 run rasterizes like the local OS, not like the runner.
      - name: Upload Golden Image Failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-image-failures
          path: Tests/Agg.Tests/bin/Release/GoldenImageFailures/
          retention-days: 30
          if-no-files-found: ignore
