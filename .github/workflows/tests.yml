name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    # The last green run took ~3 minutes. A cap here means a future hang fails in
    # half an hour instead of riding GitHub's 6-hour default to a cancel.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # PolygonMesh project-references Submodules/manifold-sharp; without this the
          # build fails with "the referenced project does not exist". Recursive, not
          # true, so a submodule of manifold-sharp would come along too.
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build tests
        run: dotnet build Tests/Agg.Tests/Agg.Tests.csproj --configuration Release

      # global.json at the repo root opts in to the Microsoft.Testing.Platform-native
      # `dotnet test` (VSTest is unsupported on the .NET 10 SDK; the dotnet.config opt-in
      # is not honored). Test options therefore use MTP syntax (--report-trx), not VSTest
      # (--logger). Note MTP's --timeout is a whole-session cap, not per-test.
      # --maximum-parallel-tests 1: the UI automation tests share window/input state and
      # fail intermittently when run in parallel; serializing costs no wall-clock time.
      # Three nested timeouts on purpose, innermost first, each one salvaging less than
      # the one before:
      #   --timeout 1200s   cancels inside MTP, so the run still writes results.trx and
      #                     the always() uploads below make a hang diagnosable. A TRX
      #                     names the test; nothing else here can.
      #   timeout-minutes:25 (this step) is for a wedge MTP cannot cancel itself out of -
      #                     a UI thread that never returns takes the session with it. A
      #                     STEP timeout FAILS the step, so its log is archived and both
      #                     always() uploads still run. That is the whole point of having
      #                     it: a job-level cancel black-holes everything, and one did -
      #                     run 33338695092 was cancelled at the job cap with no log, no
      #                     artifacts and no way to tell which test was in flight.
      #   timeout-minutes:30 (the job) stays the last resort for a wedge outside this step
      #                     entirely (restore, build, upload).
      # The clocks start at different moments - the job's from job start, the step's from
      # step start, --timeout from test-session start - and checkout+setup+build measured
      # ~5 min, so the gaps have to cover that skew plus the drain. At 1500s the inner two
      # fired 5 seconds apart and the runner died mid-drain with no TRX; 1200s buys a real
      # ~5 min window, and 25m leaves the job cap a margin of its own.
      - name: Run tests
        timeout-minutes: 25
        run: dotnet test Tests/Agg.Tests/Agg.Tests.csproj --configuration Release --no-build --report-trx --report-trx-filename results.trx --results-directory TestResults --maximum-parallel-tests 1 --timeout 1200s

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 30

      # The runners have no GPU, so the golden suites render on D3D12's software rasterizer
      # (WARP) and look for the d3d12-warp golden set. This artifact is where that set comes
      # from: a missing or mismatched golden writes the render it actually produced into
      # GoldenImageFailures, so the warp set is baselined - and later re-baselined - by
      # downloading these PNGs. It has to be CI's own renders, because WARP ships with Windows
      # and a local AGG_FORCE_WARP=1 run rasterizes like the local OS, not like the runner.
      - name: Upload Golden Image Failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-image-failures
          path: Tests/Agg.Tests/bin/Release/GoldenImageFailures/
          retention-days: 30
          if-no-files-found: ignore
